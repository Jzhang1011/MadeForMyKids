name = "madeformykids-landing"
compatibility_date = "2026-11-06"
main = "src/worker.js"

# One Worker, split by hostname (see src/worker.js):
#  - madeformyfamily.com (apex, Worker route set in the dashboard): Family Board
#    marketing pages from ./public (/, /guides/, /visual-guidance/, /visual-schedules/).
#    Everything else 301s to www.madeformykids.com.
#  - madeformykids.com + www (Workers custom domains, set in the dashboard): the kids
#    learning portal and /ski/, proxied from GitHub Pages (private.madeformykids.com).
#    Family Board pages 301 to madeformyfamily.com.
# No routes are declared here on purpose: `wrangler deploy` then leaves the existing
# dashboard-managed custom domains and routes untouched.
# www.madeformyfamily.com -> apex redirect lives in ../www-redirect (its own Worker).

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# /ski/api/* -> ski-data Worker (../ski-data: cron refresh + KV-backed JSON for madeformykids.com/ski).
[[services]]
binding = "SKI_DATA_SVC"
service = "ski-data"
