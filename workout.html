<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing Gym — BuildForMyKids</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/writing.css">
</head>
<body data-grade="3">
  <header class="gym-header">
    <h1>✍️ Writing Gym</h1>
    <div class="grade-pill" id="grade-indicator">Grade 3: Story Builder</div>
  </header>

  <main id="workout-app" class="workout-container">
    <!-- Dynamic exercise content injected by js/app.js -->
    <section id="prompt-container" class="card"></section>
    
    <section id="scaffold-container" class="card"></section>

    <section id="editor-container" class="card">
      <textarea id="student-editor" placeholder="Start building your writing here..."></textarea>
      <div class="editor-stats">
        <span id="word-count">Words: 0</span>
        <button id="btn-submit-workout" class="btn-primary">Check Workout</button>
      </div>
    </section>

    <section id="feedback-tray" class="feedback-panel" hidden></section>
  </main>

  <!-- ES Module script connects the engine to the DOM -->
  <script type="module" src="../js/app.js"></script>
</body>
</html>
