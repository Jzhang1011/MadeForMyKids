<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learn — MadeForMyKids</title>
  <meta name="description" content="Guided lessons across Typing, Mac Skills, Math, and STEM — coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/components/theme.css" />
  <style>
    .note { margin: 1.25rem 0 1rem; color: var(--mfk-slate-soft); max-width: 36rem; }
    .lesson-stack { display: grid; gap: 0.85rem; max-width: 40rem; }
  </style>
</head>
<body class="mfk-page">
  <mfk-header active="learn"></mfk-header>
  <main class="mfk-container mfk-section">
    <mfk-page-hero
      badge="Coming soon"
      title="Learn"
      subtitle="Guided lessons across Typing, Mac Skills, Math, and STEM — coming soon."
    ></mfk-page-hero>

    <p class="note">Sample lesson tiles while this hub is under construction. Ready activities live on Typing Adventure and Olympiad Forge.</p>
    <div class="lesson-stack">
      <mfk-lesson-card
        skill="typing"
        title="Home-row warm-up"
        blurb="Find the home keys and type short words with the fox."
        duration="8 min"
        href="/typing.html"
        cta-label="Learn"
      ></mfk-lesson-card>
      <mfk-lesson-card
        skill="math"
        title="Contest warm-up set"
        blurb="A handful of AMC-style problems to stretch thinking."
        duration="12 min"
        href="/amc/"
        progress="40"
        cta-label="Learn"
      ></mfk-lesson-card>
      <mfk-lesson-card
        skill="mac"
        title="Finder &amp; folders"
        blurb="Name files, make folders, and keep a project tidy on a Mac."
        duration="10 min"
        href="/learn/"
        cta-label="Coming soon"
      ></mfk-lesson-card>
    </div>

  </main>
  <mfk-footer></mfk-footer>
  <script src="/components/header.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/pageHero.js"></script>
  <script src="/components/skillBadge.js"></script>
  <script src="/components/lessonCard.js"></script>
  <script src="/components/toast.js"></script>
</body>
</html>
