name: Ski dashboard refresh (backup)

# Primary refresh is the ski-data Cloudflare Worker (ski-data/, cron every 15 min -> KV, served at
# /ski/api/*). This workflow only keeps the git fallback copy (ski/data/*.json) reasonably fresh in case
# the Worker is down. The hourly intel cron was removed: the Worker covers it, and hourly commits to
# main added noise. A failed source keeps its last good data (merged), and the job goes red so GitHub
# emails the repo owner.
on:
  schedule:
    # 13:10 UTC = 6:10 AM MST, after the Worker's 5:30 AM full refresh. GitHub may start it late.
    - cron: '10 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ski-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch weather, roads, alerts, cameras, resort intel
        id: fetch
        run: |
          if node ski/scripts/fetch-data.mjs; then echo "failed=0" >> "$GITHUB_OUTPUT"; else echo "failed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Commit snapshot (good sources updated, failed sources keep last good data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ski/data/latest.json ski/data/intel.json ski/data/cameras.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "ski: backup data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail the run if any source failed (GitHub emails on failure)
        if: steps.fetch.outputs.failed == '1'
        run: |
          echo "::error::One or more data sources failed; see the fetch step log. Last good data was kept."
          exit 1
