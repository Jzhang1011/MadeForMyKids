<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games — MadeForMyKids</title>
  <meta name="description" content="Playful challenges that reinforce learning — coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/components/theme.css" />
  <style>
    .note { margin: 1.25rem 0 1rem; color: var(--mfk-slate-soft); max-width: 36rem; }
  </style>
</head>
<body class="mfk-page">
  <mfk-header active="games"></mfk-header>
  <main class="mfk-container mfk-section">
    <mfk-page-hero
      badge="Coming soon"
      title="Games"
      subtitle="Playful challenges that reinforce learning — coming soon."
    ></mfk-page-hero>

    <p class="note">Sample game cards while this hub is under construction.</p>
    <div class="mfk-grid-cards">
      <mfk-activity-card
        skill="typing"
        title="Fox Typing Adventure"
        blurb="Type with the fox — a game-like path through accuracy and rhythm."
        difficulty="beginner"
        duration="10 min"
        href="/typing.html"
        cta-label="Play"
      ></mfk-activity-card>
      <mfk-activity-card
        skill="math"
        title="Olympiad Forge"
        blurb="Contest-style math puzzles that feel like a challenge, not a worksheet."
        difficulty="challenge"
        duration="15+ min"
        href="/amc/"
        cta-label="Play"
      ></mfk-activity-card>
      <mfk-activity-card
        skill="stem"
        title="STEM lab games"
        blurb="Hands-on science and engineering play — coming soon."
        difficulty="intermediate"
        duration="Coming soon"
        href="/games/"
        cta-label="Coming soon"
      ></mfk-activity-card>
    </div>

  </main>
  <mfk-footer></mfk-footer>
  <script src="/components/header.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/pageHero.js"></script>
  <script src="/components/skillBadge.js"></script>
  <script src="/components/difficultyBadge.js"></script>
  <script src="/components/activityCard.js"></script>
  <script src="/components/toast.js"></script>
</body>
</html>
