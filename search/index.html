<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search — MadeForMyKids</title>
  <meta name="description" content="Search MadeForMyKids skills and activities." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/components/theme.css" />
  <style>
    .search-box {
      margin: 1.25rem 0 1.75rem;
      display: flex;
      gap: 0.5rem;
      max-width: 28rem;
    }
    .search-box input {
      flex: 1;
      border: 1px solid var(--mfk-border);
      border-radius: 9999px;
      padding: 0.65rem 1rem;
      font: inherit;
      background: var(--mfk-white);
    }
    .search-box input:focus {
      outline: 3px solid var(--mfk-coral);
      outline-offset: 1px;
    }
    .search-box button {
      border: none;
      background: var(--mfk-coral);
      color: #fff;
      font-weight: 600;
      border-radius: 9999px;
      padding: 0.65rem 1.15rem;
      cursor: pointer;
    }
    .search-box button:hover { background: var(--mfk-coral-dark); }
    .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
    .results li {
      background: var(--mfk-white);
      border: 1px solid var(--mfk-border);
      border-radius: var(--mfk-radius);
      padding: 1rem 1.15rem;
      box-shadow: var(--mfk-shadow);
    }
    .results a {
      color: var(--mfk-coral-dark);
      font-weight: 600;
      text-decoration: none;
    }
    .results a:hover { text-decoration: underline; }
    .results a:focus-visible { outline: 3px solid var(--mfk-coral); outline-offset: 2px; border-radius: 4px; }
    .results p { margin: 0.35rem 0 0; color: var(--mfk-slate-soft); font-size: 0.95rem; }
    .hint { color: var(--mfk-slate-soft); margin: 0 0 1rem; }
    #query-label { font-weight: 600; color: var(--mfk-slate); }
  </style>
</head>
<body class="mfk-page">
  <mfk-header active="home"></mfk-header>
  <main class="mfk-container mfk-section">
    <mfk-page-hero
      badge="Search"
      title="Search"
      subtitle="Find skills and activities across every topic."
    ></mfk-page-hero>

    <form class="search-box" id="search-form" role="search" aria-label="Search MadeForMyKids">
      <label class="mfk-sr-only" for="q">Search query</label>
      <input id="q" name="q" type="search" placeholder="Search skills &amp; activities" autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <p class="hint" id="hint">Type above to search topics and lessons.</p>
    <ul class="results" id="results" aria-live="polite"></ul>
  </main>
  <mfk-footer></mfk-footer>
  <script src="/components/header.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/pageHero.js"></script>
  <script src="/components/toast.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var q = (params.get("q") || "").trim();
      var input = document.getElementById("q");
      var hint = document.getElementById("hint");
      var results = document.getElementById("results");
      var form = document.getElementById("search-form");
      if (input) input.value = q;

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function matches(entry, tokens) {
        var hay = (entry.title + " " + entry.blurb + " " + (entry.keywords || "")).toLowerCase();
        return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
      }

      function render(entries, query) {
        if (!query) {
          hint.textContent = "Showing all topics and lessons — type above to narrow it down.";
        } else if (!entries.length) {
          hint.textContent = "No matches for \u201c" + query + "\u201d. Try \u201ctyping\u201d, \u201cmoney\u201d, or \u201cmath\u201d.";
        } else {
          hint.textContent = entries.length + (entries.length === 1 ? " match" : " matches") + " for \u201c" + query + "\u201d.";
        }
        results.innerHTML = entries.map(function (e) {
          return "<li><a href=\"" + esc(e.href) + "\">" + esc(e.title) + "</a>" +
            (e.ages ? " <span style=\"font-size:0.8rem;color:#64748b;font-weight:600\">Ages " + esc(e.ages) + "</span>" : "") +
            "<p>" + esc(e.blurb) + "</p></li>";
        }).join("");
      }

      fetch("/data/search-index.json")
        .then(function (r) { return r.json(); })
        .then(function (index) {
          var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
          var entries = tokens.length ? index.filter(function (e) { return matches(e, tokens); }) : index.slice();
          render(entries, q);
          form.addEventListener("submit", function (ev) {
            ev.preventDefault();
            var next = (input && input.value || "").trim();
            var tokens2 = next.toLowerCase().split(/\s+/).filter(Boolean);
            var entries2 = tokens2.length ? index.filter(function (e) { return matches(e, tokens2); }) : index.slice();
            render(entries2, next);
            var url = next ? "/search/?q=" + encodeURIComponent(next) : "/search/";
            window.history.replaceState(null, "", url);
          });
        })
        .catch(function () {
          hint.textContent = "Search could not load. Try the topic list on the Learn page instead.";
          results.innerHTML = "";
        });
    })();
  </script>
  <script src="/components/analytics.js"></script>
</body>
</html>
