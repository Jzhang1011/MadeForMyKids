<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox Typing Adventure · MadeForMyKids</title>
  <script>
  Promise.all([
    fetch('/components/typing-shell-a.html').then(r=>r.text()),
    fetch('/components/typing-shell-b.html').then(r=>r.text())
  ]).then(([a,b])=>{
    document.open(); document.write(a+b); document.close();
  }).catch(err=>{
    document.body.textContent = 'Failed to load Typing Adventure: ' + err;
  });
  </script>
</head>
<body class="mfk-page"><p>Loading Fox Typing Adventure…</p></body>
</html>
